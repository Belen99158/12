body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);font-size:14px}

<script>
/* ===== CONFIG ===== */
var firebaseConfig={apiKey:"AIzaSyDI_Xszfjw9f_O1CsL0VC8F_dNtWGEvmo8",authDomain:"devoluciones-y-garantias.firebaseapp.com",databaseURL:"https://devoluciones-y-garantias-default-rtdb.firebaseio.com",projectId:"devoluciones-y-garantias",storageBucket:"devoluciones-y-garantias.firebasestorage.app",messagingSenderId:"1009454788938",appId:"1:1009454788938:web:aa7dc86d838f0c6d2051b3"};
var SUCURSALES={"004":"AV. EL REY","002":"BODEGA","003":"AV. 6 DE DICIEMBRE","007":"AGENCIA LA PRENSA","006":"AGENCIA TUMBACO"};
var MESES=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
var PALETA=["#0E2A47","#D61F26","#143A60","#1A1A1A","#5B6877","#1E7F4F","#C77F00","#6A2E91","#2E7D9B","#A3161B"];

/* ===== UMBRALES DE TASA (ajustables) ===== */
var UMBRAL_OK=2.0;     /* 🟢 sano  : < 2%        */
var UMBRAL_ALERTA=4.6; /* 🔴 alerta: > 4.6%      */
/* 🟡 atención queda automáticamente entre 2.01% y 4.5% */

var state={tickets:[],guias:[]}, fbReady=false, desde="", hasta="";
var ventasBase=[], ventasCargadas=false, totalProdSheet={};
var comprasCliente={};      /* compras (TOTAL DOCUMENTO) por cliente, desde el Sheet */
var columnasCSV={};         /* qué columnas se detectaron en el Sheet (diagnóstico) */
var filtroSucursal="", filtroVendedor="", filtroMotivo="";
/* La base de ventas ya NO se descarga de un Google Sheet publicado en la web ni a
   traves de proxies de terceros: se lee de Firebase, que exige sesion y reglas.
   La sube Administrativo desde el panel Administrativo del sistema. */

/* ===== UTIL ===== */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function money(n){ return "$"+(Number(n)||0).toFixed(2); }
function dnum(n){ return (Number(n)||0).toFixed(1); }
function fdate(d){ if(!d) return ""; var x=new Date(d); return isNaN(x)?String(d):x.toLocaleDateString("es-EC",{day:"2-digit",month:"2-digit",year:"numeric"}); }
/* Fecha en formato dd/mm/yyyy (igual que el Google Sheets). Si no se puede parsear, devuelve el texto tal cual. */
function fechaDMY(d){ if(d==null||d==="") return ""; var x=parseFecha(d); if(!x) return String(d); return String(x.getDate()).padStart(2,"0")+"/"+String(x.getMonth()+1).padStart(2,"0")+"/"+x.getFullYear(); }
function hoyStr(d){ var x=parseFecha(d); if(!x) return ""; return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); }
function mesStr(d){ var x=parseFecha(d); if(!x) return ""; return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0"); }
function parseFecha(d){
  if(!d) return null;
  if(d instanceof Date) return isNaN(d)?null:d;
  var s=String(d).trim();
  var m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if(m){
    var dd=+m[1], mm=+m[2], yy=+m[3]; if(yy<100) yy+=2000;
    if(mm>12&&dd<=12){ var t=dd; dd=mm; mm=t; }
    var x=new Date(yy,mm-1,dd); return isNaN(x)?null:x;
  }
  var x2=new Date(s); return isNaN(x2)?null:x2;
}
/* Días entre dos fechas (devuelve null si falta alguna o el orden es inválido) */
function diasEntre(a,b){ var x=parseFecha(a), y=parseFecha(b); if(!x||!y) return null; var d=(y-x)/86400000; return (isFinite(d)&&d>=0)?d:null; }
/* Fecha de la respuesta de revisión: devolución o garantía, la que exista */
function fechaRevision(t){ return (t.fechas&&(t.fechas.devolucion||t.fechas.garantia||t.fechas.dacionAutorizacion))||null; }
function arr(v){ if(Array.isArray(v)) return v; if(v&&typeof v==="object") return Object.keys(v).map(function(k){return v[k];}); return []; }
function sucursalDe(factura){ var m=String(factura||"").match(/(\d{3})/); var cod=m?m[1]:""; return {codigo:cod,nombre:SUCURSALES[cod]||(cod?"Sucursal "+cod:"Sin sucursal")}; }
function llegoQ(i){ if(!i.merc) return 0; return i.merc.cantLlegada!==undefined?i.merc.cantLlegada:(i.merc.llego?i.cantidad:0); }
function clienteTipo(t){ var ruc=String(t.ruc||""); if(ruc.length===13) return "Mayorista"; return "Minorista"; }
function tipoDeItem(t,i){ return i.tipo||(t.motivo==="GARANTIAS"?"GARANTIA":"DEVOLUCION"); }
function garCantAcep(t,i,x){
  if(t.gar&&t.gar.itemsAcep&&t.gar.itemsAcep[x]!==undefined) return t.gar.itemsAcep[x];
  if(t.gar&&t.gar.acepta===true) return llegoQ(i);   /* compat: tickets viejos aceptados completos */
  return 0;
}
function garCantRech(t,i,x){ return Math.max(0,llegoQ(i)-garCantAcep(t,i,x)); }
function itemsAceptados(t){
  var out=[];
  t.items.forEach(function(i){
    if(i.dev&&i.dev.acepta&&i.dev.cantAcep>0){
      var f=i.cantidad?i.dev.cantAcep/i.cantidad:0;
      out.push(Object.assign({},i,{cantNC:i.dev.cantAcep,neto:i.neto*f,iva:i.iva*f,total:i.total*f}));
    }
  });
  if(t.gar){
    t.items.forEach(function(i,x){
      var q=llegoQ(i);
      if(q>0&&tipoDeItem(t,i)==="GARANTIA"){
        var cant=garCantAcep(t,i,x);
        if(cant>0){
          var f2=i.cantidad?cant/i.cantidad:0;
          out.push(Object.assign({},i,{cantNC:cant,neto:i.neto*f2,iva:i.iva*f2,total:i.total*f2}));
        }
      }
    });
  }
  return out;
}
function totalAceptado(t){ return itemsAceptados(t).reduce(function(s,i){return s+i.total;},0); }
/* Valor que el revisor NO aceptó (llegó menos aceptado). Excluye el flujo 8800 (i.dev.auto). */
function totalNoAceptado(t){
  var s=0;
  (t.items||[]).forEach(function(i){
    if(!i.dev||i.dev.auto) return;
    if(tipoDeItem(t,i)!=="DEVOLUCION") return;
    var lleg=llegoQ(i); if(lleg<=0) return;
    var rech=Math.max(0,lleg-(i.dev.acepta?(i.dev.cantAcep||0):0));
    if(rech>0&&i.cantidad) s+=i.total*(rech/i.cantidad);
  });
  return s;
}
/* color según umbrales de tasa */
function colorTasa(ta){ return ta>UMBRAL_ALERTA?"var(--rojo)":(ta>UMBRAL_OK?"#C77F00":"var(--ok)"); }

/* ===== FIREBASE ===== */
async function initFirebase(){
  try{
    if(typeof firebase==="undefined") throw new Error("SDK no cargó");
    firebase.initializeApp(firebaseConfig);
    /* Este dashboard ya NO inicia sesión anónima: las reglas de la base solo dejan
       leer a usuarios reales de Firebase Authentication. Reaprovecha la sesión que
       ya abriste en el sistema principal (index.html) en este mismo navegador. */
    var user=await new Promise(function(resolve){
      var unsub=firebase.auth().onAuthStateChanged(function(u){ unsub(); resolve(u); });
      setTimeout(function(){ resolve(firebase.auth().currentUser); },4000);
    });
    if(!user) throw new Error("Sin sesión activa.");
    fbReady=true;
    var fb=$("chip-fb"); if(fb) fb.textContent="🟢 En línea";
    return true;
  }catch(e){ console.error(e); var fb=$("chip-fb"); if(fb) fb.textContent="🔴 Sin conexión"; return false; }
}
function cargarEstado(){
  if(!fbReady){ $("main").innerHTML='<div class="card"><div class="empty"><div class="big">Sin conexión a Firebase</div>Abre este dashboard desde el botón "Abrir dashboard" del sistema principal después de iniciar sesión ahí; este dashboard reutiliza esa sesión y ya no acepta visitantes anónimos.</div></div>'; return; }
  var prog=$("load-prog"); if(prog) prog.style.width="40%";
  firebase.database().ref("estado").get().then(function(snap){
    var val=snap.val()||{};
    state={tickets:arr(val.tickets),guias:arr(val.guias)};
    if(prog) prog.style.width="100%";
    render();
    cargarVentas().then(function(){ render(); }).catch(function(e){ console.warn("Ventas:",e&&e.message); render(); });
  }).catch(function(e){
    console.error(e);
    $("main").innerHTML='<div class="card"><div class="empty"><div class="big">Error al cargar</div>'+esc(e&&e.message||e)+'</div></div>';
  });
}

/* ===== GRÁFICOS SVG ===== */
function svgBarras(datos,opts){
  opts=opts||{};
  var max=1; datos.forEach(function(d){ if(d.valor>max) max=d.valor; });
  function fmt(v){ return opts.money?money(v):v.toLocaleString("es-EC"); }
  if(datos.length===0) return '<div class="muted" style="padding:10px">Sin datos</div>';
  return '<div style="padding:6px 0">'+datos.map(function(d,i){ var pct=d.valor/max*100; return '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><div style="width:150px;font-size:11px;text-align:right;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(d.label)+'">'+esc(d.label)+'</div><div style="flex:1;background:#EEF1F4;border-radius:4px;height:20px"><div style="width:'+pct+'%;background:'+(opts.color||PALETA[i%PALETA.length])+';height:100%;border-radius:4px;min-width:2px"></div></div><div style="width:90px;font-size:11px;font-weight:600;text-align:right">'+fmt(d.valor)+'</div></div>'; }).join("")+'</div>';
}
function svgPastel(datos){
  if(datos.length===0) return '<div class="muted" style="padding:10px">Sin datos</div>';
  var total=0; datos.forEach(function(d){ total+=d.valor; }); if(total<=0) total=1;
  var ang=0, R=70, CX=80, CY=80, slices="";
  datos.forEach(function(d,i){
    var frac=d.valor/total, a0=ang, a1=ang+frac*2*Math.PI; ang=a1;
    var x0=CX+R*Math.cos(a0), y0=CY+R*Math.sin(a0), x1=CX+R*Math.cos(a1), y1=CY+R*Math.sin(a1);
    var large=frac>0.5?1:0;
    if(frac>=0.999){ slices+='<circle cx="'+CX+'" cy="'+CY+'" r="'+R+'" fill="'+PALETA[i%PALETA.length]+'"></circle>'; }
    else slices+='<path d="M'+CX+','+CY+' L'+x0.toFixed(1)+','+y0.toFixed(1)+' A'+R+','+R+' 0 '+large+',1 '+x1.toFixed(1)+','+y1.toFixed(1)+' Z" fill="'+PALETA[i%PALETA.length]+'"></path>';
  });
  var leyenda=datos.map(function(d,i){ return '<div style="display:flex;align-items:center;gap:6px;font-size:11px;margin-bottom:3px"><span style="width:11px;height:11px;background:'+PALETA[i%PALETA.length]+';border-radius:2px;display:inline-block"></span><span style="flex:1">'+esc(d.label)+'</span><b>'+(d.valor/total*100).toFixed(1)+'%</b></div>'; }).join("");
  return '<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><svg width="160" height="160" viewBox="0 0 160 160">'+slices+'</svg><div style="flex:1;min-width:150px">'+leyenda+'</div></div>';
}
function svgLinea(labels,valores){
  if(valores.length===0) return '<div class="muted" style="padding:10px">Sin datos</div>';
  var W=600,H=160,P=30,max=1; valores.forEach(function(v){ if(v>max) max=v; });
  var pts=valores.map(function(v,i){ var x=P+(i/Math.max(1,valores.length-1))*(W-2*P); var y=H-P-(v/max)*(H-2*P); return [x,y]; });
  var linea=pts.map(function(p,i){ return (i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1); }).join(" ");
  var area=linea+" L"+pts[pts.length-1][0].toFixed(1)+","+(H-P)+" L"+pts[0][0].toFixed(1)+","+(H-P)+" Z";
  var dots=pts.map(function(p){ return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3" fill="#D61F26"></circle>'; }).join("");
  var xl=labels.map(function(l,i){ if(labels.length>12&&i%Math.ceil(labels.length/12)!==0) return ""; var x=P+(i/Math.max(1,labels.length-1))*(W-2*P); return '<text x="'+x.toFixed(1)+'" y="'+(H-8)+'" font-size="9" text-anchor="middle" fill="#5B6877">'+esc(l)+'</text>'; }).join("");
  return '<svg width="100%" viewBox="0 0 '+W+' '+H+'" style="max-width:100%"><path d="'+area+'" fill="rgba(214,31,38,.1)"></path><path d="'+linea+'" fill="none" stroke="#D61F26" stroke-width="2"></path>'+dots+xl+'</svg>';
}

/* ===== CÁLCULO ===== */
/* Los ANULADOS (estado ELIMINADO) ya NO se excluyen: entran mezclados en el reporte para
   poder medirlos. No suman dinero aprobado (un ticket anulado no genera NC), pero sí
   aparecen en el detalle y en el KPI de anulados por asesor. */
function esAnulado(t){ return t.estado==="ELIMINADO"; }
function ticketsFiltrados(){
  return state.tickets.filter(function(t){
    if(t.anioAnterior) return false;   /* los 2200 (años anteriores) van en su propio reporte, no en los indicadores del año actual */
    var f=hoyStr(t.fechaTicket);
    if(desde&&f<desde) return false;
    if(hasta&&f>hasta) return false;
    if(filtroSucursal&&sucursalDe(t.factura).nombre!==filtroSucursal) return false;
    if(filtroVendedor&&t.vendedor!==filtroVendedor) return false;
    if(filtroMotivo&&t.motivo!==filtroMotivo) return false;
    return true;
  });
}
function setFiltro(tipo,val){
  if(tipo==="sucursal") filtroSucursal=(filtroSucursal===val?"":val);
  if(tipo==="vendedor") filtroVendedor=(filtroVendedor===val?"":val);
  if(tipo==="motivo") filtroMotivo=(filtroMotivo===val?"":val);
  render();
}
function limpiarFiltros(){ filtroSucursal=""; filtroVendedor=""; filtroMotivo=""; render(); }
function datosConMonto(tks){
  return tks.map(function(t){
    var anulado=esAnulado(t);
    /* Un ticket anulado no aporta dinero aprobado: su NC quedó sin efecto */
    var esAceptado=!anulado&&((t.estado==="NC")||(t.fechas&&t.fechas.nc));
    var aceptado=esAceptado?totalAceptado(t):0;
    var totalTicket=t.items.reduce(function(s,i){return s+i.total;},0);
    /* REQ 5: el dashboard suma SOLO lo aceptado (garantías/devoluciones aceptadas → NC). */
    return {t:t,monto:aceptado,aceptado:aceptado,esAceptado:!!esAceptado,anulado:anulado,totalTicket:totalTicket,suc:sucursalDe(t.factura)};
  });
}
function topN(obj,n){
  var arr2=Object.keys(obj).map(function(k){ return {k:k,v:(typeof obj[k]==="object"?obj[k].monto||obj[k].cant||0:obj[k]),full:obj[k]}; });
  arr2.sort(function(a,b){ return b.v-a.v; });
  return arr2.slice(0,n||10);
}

/* ===== CARGA DE VENTAS (CSV) ===== */
function splitCSVLine(line,sep){
  sep=sep||",";
  var cols=[], cur="", inQ=false;
  for(var i=0;i<line.length;i++){
    var c=line[i];
    if(c==='"'){ if(inQ&&line[i+1]==='"'){ cur+='"'; i++; } else { inQ=!inQ; } }
    else if(c===sep&&!inQ){ cols.push(cur); cur=""; }
    else { cur+=c; }
  }
  cols.push(cur);
  return cols;
}
function numEC(s){
  if(s==null) return 0;
  s=String(s).trim().replace(/[^0-9.,\-]/g,"");
  if(!s) return 0;
  var hasC=s.indexOf(",")>=0, hasP=s.indexOf(".")>=0;
  if(hasC&&hasP){
    if(s.lastIndexOf(",")>s.lastIndexOf(".")){ s=s.replace(/\./g,"").replace(",","."); }
    else { s=s.replace(/,/g,""); }
  }else if(hasC){
    var partes=s.split(",");
    if(partes.length===2&&partes[1].length===3&&partes[0].length<=3){ s=s.replace(",",""); }
    else { s=s.replace(",","."); }
  }
  var n=parseFloat(s);
  return isNaN(n)?0:n;
}
function descomprimirBase(o){
  if(!o||!o.r) return [];
  var p=o.p;
  return o.r.map(function(a){ return {emision:p[a[0]],factura:p[a[1]],ruc:p[a[2]],razon:p[a[3]],codigo:p[a[4]],desc:p[a[5]],sub:p[a[6]],facturador:p[a[7]],cant:a[8],neto:a[9],iva:a[10],total:a[11],creditoAplicado:a[12]||0,totalDoc:a.length>13?(a[13]||0):0,mes:a.length>14?(p[a[14]]||""):""}; });
}
/* Reconstruye la vista por factura a partir de las filas guardadas en Firebase.
   Hace exactamente lo mismo que hacia parsearVentas con el CSV del Sheet. */
function construirVentasDesdeFilas(filas){
  var vistas={}, orden=[];
  totalProdSheet={}; comprasCliente={};
  var conTotalDoc=false, conMes=false;
  filas.forEach(function(x){
    var fact=String(x.factura||"").trim();
    if(!fact) return;
    if(x.totalDoc) conTotalDoc=true;
    if(x.mes) conMes=true;
    if(x.codigo) totalProdSheet[fact+"|"+String(x.codigo).trim()]=x.total||0;
    if(!vistas[fact]){
      vistas[fact]={factura:fact,emision:String(x.emision||"").trim(),razon:String(x.razon||"").trim(),ruc:String(x.ruc||"").trim(),totalDoc:0,neto:0,cant:0,mes:String(x.mes||"").trim()};
      orden.push(fact);
    }
    var rec=vistas[fact];
    rec.neto+=(x.neto||0);
    rec.cant+=(x.cant||0);
    if((x.totalDoc||0)>rec.totalDoc) rec.totalDoc=(x.totalDoc||0);
    if(!rec.emision&&x.emision) rec.emision=String(x.emision).trim();
    if(!rec.razon&&x.razon) rec.razon=String(x.razon).trim();
    if(!rec.mes&&x.mes) rec.mes=String(x.mes).trim();
  });
  columnasCSV={mes:conMes,cantidad:true,totalDoc:conTotalDoc,neto:true,cliente:true};
  var listaV=orden.map(function(f){ return vistas[f]; });
  listaV.forEach(function(r){ comprasCliente[r.razon]=(comprasCliente[r.razon]||0)+r.totalDoc; });
  return listaV;
}
async function cargarVentas(){
  var db=firebase.database();
  var ms=await db.ref("baseFacturas/meta").get();
  var meta=ms.val();
  if(!meta||!meta.n) throw new Error("La base de facturas no esta cargada en Firebase. Pidele a Administrativo que la suba desde el panel Administrativo del sistema.");
  var json="";
  for(var i=0;i<meta.n;i++){
    var c=await db.ref("baseFacturas/chunks/"+i).get();
    json+=c.val()||"";
  }
  var filas=descomprimirBase(JSON.parse(json));
  if(!filas.length) throw new Error("La base de Firebase vino vacia.");
  ventasBase=construirVentasDesdeFilas(filas);
  ventasCargadas=true;
  return ventasBase;
}
/* Facturas (únicas) dentro del rango de fechas por EMISION */
function facturasEnRango(){
  return ventasBase.filter(function(v){
    var fe=v.emision?hoyStr(v.emision):"";
    if(desde&&fe&&fe<desde) return false;
    if(hasta&&fe&&fe>hasta) return false;
    return true;
  });
}

/* ===== TIEMPOS DE GESTIÓN (días por etapa) ===== */
/* Devuelve {emiTicket, ticketPaq, paqMerc, ticketMerc, mercRev, revNC, ciclo} por ticket, null donde falte fecha.
   ticketPaq/paqMerc separan el tiempo de la transportadora del tiempo que tarda bodega en revisar. */
function diasTicket(t){
  var rev=fechaRevision(t);
  var fin=(t.fechas&&t.fechas.nc)||null;
  var paq=(t.fechas&&t.fechas.paquete)||null;
  return {
    emiTicket: diasEntre(t.emision, t.fechaTicket),
    ticketPaq: diasEntre(t.fechaTicket, paq),
    paqMerc: diasEntre(paq, t.fechas&&t.fechas.mercaderia),
    ticketMerc: diasEntre(t.fechaTicket, t.fechas&&t.fechas.mercaderia),
    mercRev: diasEntre(t.fechas&&t.fechas.mercaderia, rev),
    revNC: diasEntre(rev, fin),
    ciclo: diasEntre(t.fechaTicket, fin)
  };
}
function acumProm(acc,key,val){ if(val==null) return; if(!acc[key]) acc[key]={s:0,n:0}; acc[key].s+=val; acc[key].n++; }
function promDe(o){ return (o&&o.n)?o.s/o.n:null; }
function celdaDias(o){ var p=promDe(o); return p==null?'<span class="muted">—</span>':('<b>'+dnum(p)+'</b> <span class="muted">d</span>'); }

/* ===== REPORTE APARTE: garantías/devoluciones de años anteriores (tickets 2200) ===== */
function estadoAnioLabel(t){
  if(t.estado==="NC") return t.nc&&t.nc.hecha?"NC hecha":"En NC";
  if(t.estado==="DEV_RECHAZADA"||t.estado==="RECHAZADA"||t.estado==="GAR_RECHAZADA") return "No aceptada";
  if(t.estado==="MERCADERIA") return "En mercadería";
  if(t.estado==="DEVOLUCION") return "Validando total";
  if(t.estado==="GARANTIA") return "En garantía";
  if(t.estado==="SIN_GUIA") return "Pendiente de guía";
  return t.estado;
}
function exportarAnioAnterior(){
  var lista=state.tickets.filter(function(t){
    if(!t.anioAnterior||t.estado==="ELIMINADO") return false;
    var f=hoyStr(t.fechaTicket);
    if(desde&&f<desde) return false;
    if(hasta&&f>hasta) return false;
    return true;
  });
  if(lista.length===0){ alert("No hay tickets de años anteriores en el periodo seleccionado."); return; }
  var rows=[];
  lista.forEach(function(t){
    var esNC=(t.estado==="NC"||(t.fechas&&t.fechas.nc));
    var acep=esNC?itemsAceptados(t):[];
    if(acep.length){
      acep.forEach(function(i){
        rows.push({"N° TICKET":t.numero,"AÑO FACTURA":t.anioFactura||"","CLIENTE":t.razonSocial,"RUC":t.ruc||"","FACTURA ANTERIOR":t.factura,"CODIGO":i.codigo,"DESCRIPCION":i.desc,"CANT. ACEPTADA":i.cantNC||0,"TOTAL ACEPTADO":+(+i.total||0).toFixed(2),"ESTADO":estadoAnioLabel(t),"N° NC":t.nc&&t.nc.numero?t.nc.numero:"","FECHA NC":t.fechas&&t.fechas.nc?fdate(t.fechas.nc):"","VENDEDOR":t.vendedor||""});
      });
    }else{
      t.items.forEach(function(i){
        rows.push({"N° TICKET":t.numero,"AÑO FACTURA":t.anioFactura||"","CLIENTE":t.razonSocial,"RUC":t.ruc||"","FACTURA ANTERIOR":t.factura,"CODIGO":i.codigo,"DESCRIPCION":i.desc,"CANT. ACEPTADA":0,"TOTAL ACEPTADO":0,"ESTADO":estadoAnioLabel(t),"N° NC":"","FECHA NC":"","VENDEDOR":t.vendedor||""});
      });
    }
  });
  var ws=XLSX.utils.json_to_sheet(rows);
  ws["!cols"]=[{wch:12},{wch:11},{wch:32},{wch:15},{wch:17},{wch:16},{wch:36},{wch:13},{wch:14},{wch:16},{wch:12},{wch:12},{wch:20}];
  var wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"Años anteriores");
  var suf=(desde||hasta)?("_"+(desde||"inicio")+"_a_"+(hasta||"hoy")):"";
  XLSX.writeFile(wb,"Garantias_anios_anteriores"+suf+".xlsx");
}
function reporteAnioAnterior(){
  var lista=state.tickets.filter(function(t){
    if(!t.anioAnterior||t.estado==="ELIMINADO") return false;
    var f=hoyStr(t.fechaTicket);
    if(desde&&f<desde) return false;
    if(hasta&&f>hasta) return false;
    return true;
  });
  if(lista.length===0) return "";
  var totalAcep=0, nAcep=0, enProceso=0, porAnio={}, porCli={};
  var cic={t2m:{s:0,n:0},m2v:{s:0,n:0},v2g:{s:0,n:0},g2nc:{s:0,n:0},tot:{s:0,n:0}};
  function accC(o,v){ if(v==null) return; o.s+=v; o.n++; }
  function promC(o){ return o.n?(o.s/o.n):null; }
  function kpiC(o,lbl,col){ var p=promC(o); return '<div class="kpi"><div class="disp" style="color:'+(col||"var(--navy)")+'">'+(p==null?"—":dnum(p))+'</div><div class="lbl">'+lbl+'</div></div>'; }
  lista.forEach(function(t){
    var acep=(t.estado==="NC"||(t.fechas&&t.fechas.nc))?totalAceptado(t):0;
    if(acep>0){ totalAcep+=acep; nAcep++; }
    else if(t.estado!=="DEV_RECHAZADA"&&t.estado!=="RECHAZADA"&&t.estado!=="GAR_RECHAZADA") enProceso++;
    var a=t.anioFactura||"?"; if(!porAnio[a]) porAnio[a]={n:0,monto:0}; porAnio[a].n++; porAnio[a].monto+=acep;
    if(!porCli[t.razonSocial]) porCli[t.razonSocial]={n:0,monto:0};
    porCli[t.razonSocial].n++; porCli[t.razonSocial].monto+=acep;
    var f=t.fechas||{};
    accC(cic.t2m,diasEntre(t.fechaTicket,f.mercaderia));
    accC(cic.m2v,diasEntre(f.mercaderia,f.devolucion));
    accC(cic.v2g,diasEntre(f.devolucion,f.garantia));
    accC(cic.g2nc,diasEntre(f.garantia,f.nc));
    accC(cic.tot,diasEntre(t.fechaTicket,f.nc));
  });
  var h='<div class="card" style="border-left:5px solid #6A2E91"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px"><div class="sec-title" style="margin:0;border:none;flex:1">📅 Garantías / devoluciones de años anteriores <span class="muted" style="font-weight:400">(reporte aparte · no cuenta en los indicadores del año actual)</span></div><button class="btn btn-ok btn-sm" onclick="exportarAnioAnterior()">⬇ Excel</button></div>';
  h+='<div class="grid4"><div class="kpi"><div class="disp" style="color:var(--navy)">'+lista.length+'</div><div class="lbl">Tickets 2200</div></div><div class="kpi"><div class="disp" style="color:var(--ok)">'+money(totalAcep)+'</div><div class="lbl">Total aceptado (NC)</div></div><div class="kpi"><div class="disp" style="color:#C77F00">'+enProceso+'</div><div class="lbl">En proceso</div></div><div class="kpi"><div class="disp" style="color:var(--navy)">'+nAcep+'</div><div class="lbl">Tickets aceptados</div></div></div>';
  var anios=Object.keys(porAnio).sort();
  h+='<div class="grid2" style="margin-top:12px"><div><div class="sec-title">Por año de factura</div><div style="overflow-x:auto"><table><thead><tr><th>Año</th><th class="num">Tickets</th><th class="num">Total aceptado</th></tr></thead><tbody>'+anios.map(function(a){ return '<tr><td>'+esc(a)+'</td><td class="num">'+porAnio[a].n+'</td><td class="num">'+money(porAnio[a].monto)+'</td></tr>'; }).join("")+'</tbody></table></div></div>';
  var cliArr=Object.keys(porCli).map(function(k){return {k:k,n:porCli[k].n,monto:porCli[k].monto};}).sort(function(a,b){return (b.n-a.n)||(b.monto-a.monto);}).slice(0,10);
  h+='<div><div class="sec-title">Clientes que más regresan</div><div style="overflow-x:auto"><table><thead><tr><th>Cliente</th><th class="num">N° tickets</th><th class="num">Total aceptado</th></tr></thead><tbody>'+cliArr.map(function(c){ return '<tr><td style="font-size:12px">'+esc(c.k)+'</td><td class="num">'+c.n+'</td><td class="num">'+money(c.monto)+'</td></tr>'; }).join("")+'</tbody></table></div></div></div>';
  h+='<div class="sec-title">Ciclo del ticket (días promedio)</div><div class="grid5">'+kpiC(cic.t2m,"Ticket → Mercadería")+kpiC(cic.m2v,"Mercadería → Validación")+kpiC(cic.v2g,"Validación → Garantía")+kpiC(cic.g2nc,"Garantía → NC")+kpiC(cic.tot,"Ciclo total (Ticket → NC)","var(--rojo)")+'</div><div class="muted" style="margin-top:6px">Promedios calculados solo con tickets que tienen ambas fechas de cada etapa.</div>';
  h+='<div class="sec-title">Detalle</div><div style="overflow-x:auto"><table><thead><tr><th>N° Ticket</th><th>Año</th><th>Cliente</th><th>Factura</th><th>Motivo</th><th>Estado</th><th class="num">Total aceptado</th></tr></thead><tbody>'+lista.slice().reverse().map(function(t){ var acep=(t.estado==="NC"||(t.fechas&&t.fechas.nc))?totalAceptado(t):0; return '<tr><td><b>'+esc(t.numero)+'</b></td><td>'+esc(t.anioFactura||"")+'</td><td>'+esc(t.razonSocial)+'</td><td>'+esc(t.factura)+'</td><td>'+(t.motivo==="GARANTIAS"?"Garantía":"Devolución")+'</td><td>'+esc(estadoAnioLabel(t))+'</td><td class="num">'+(acep>0?money(acep):'<span class="muted">—</span>')+'</td></tr>'; }).join("")+'</tbody></table></div>';
  h+='</div>';
  return h;
}

/* ===== DESCARGA: FACTURAS DEL RANGO ===== */

/* Mismo texto de estado que usa la hoja "Datos Tickets" del reporte gerencial (linea ~915),
   factorizado aqui para no repetirlo. */
function estadoTicketTxt(t,anulado){
  return anulado?"ANULADO"
    :(t.estado==="NC"&&t.nc&&t.nc.hecha)?"APROBADO (NC hecha)"
    :(t.estado==="NC")?"APROBADO (NC pendiente)"
    :(t.estado==="DACION_ADMIN")?"EN PROCESO (Dación: por autorizar)"
    :(t.estado==="MERCADERIA"&&!(t.paquete&&t.paquete.llego))?"EN TRANSITO (paquete no llega)":"EN PROCESO";
}

/* ===== EXPORTAR EXCEL: llegada de guías/paquetes (bultos, comentario, quién recibió) =====

function exportarLlegadaPaquetes(){
  var tks=ticketsFiltrados().filter(function(t){ return !!t.guiaNumero; });
  if(tks.length===0){ alert("No hay tickets con guía en este rango de fechas."); return; }
  var rows=tks.slice().sort(function(a,b){ return String(a.guiaNumero).localeCompare(String(b.guiaNumero))||String(a.fechaTicket).localeCompare(String(b.fechaTicket)); }).map(function(t){
    var pq=t.paquete||null;
    return {
      "GUÍA":t.guiaNumero||"","N° TICKET":t.numero,"ASESOR":t.vendedor,"CLIENTE":t.razonSocial,
      "FECHA TICKET":fechaDMY(t.fechaTicket),
      "LLEGÓ EL PAQUETE":pq&&pq.llego?"SÍ":"NO",
      "FECHA LLEGADA":pq&&pq.f?fechaDMY(pq.f):"",
      "BULTOS":pq&&pq.cartones!=null?pq.cartones:"",
      "TRANSPORTADORA":pq&&pq.transportadora||"",

/* ===== EXPORTAR EXCEL (reporte gerencial trazable, con fórmulas) ===== */
function exportarExcel(){
  var tks=ticketsFiltrados();
  var datos=datosConMonto(tks);
  if(datos.length===0){ alert("Sin datos para exportar."); return; }
  var wb=XLSX.utils.book_new();

  /* Letra de columna de Excel a partir del nombre de la cabecera.
     Evita que las fórmulas del RESUMEN se rompan al agregar o mover columnas. */
  function colDe(rows,nombre){
    var k=rows.length?Object.keys(rows[0]):[];
    var ix=k.indexOf(nombre);
    if(ix<0) throw new Error("Columna no encontrada en el reporte: "+nombre);
    return XLSX.utils.encode_col(ix);
  }

  /* emisión del Sheet por factura (para que la fecha salga igual que en el Sheet) */
  var emiMap={};
  ventasBase.forEach(function(v){ if(emiMap[v.factura]===undefined) emiMap[v.factura]=v.emision; });
  function emiDe(t){ var e=emiMap[t.factura]; return fechaDMY(e!=null&&e!==""?e:t.emision); }

  /* ===================== HOJA: DATOS FACTURAS ===================== */
  var facts=facturasEnRango();
  var fRows=facts.map(function(v){ return {
    "MES":v.mes||mesStr(v.emision),

    "CANTIDAD":+(+v.cant).toFixed(2)
  }; });
  /* A MES,B FACTURA,C SUCURSAL,D EMISION,E CLIENTE,F RUC,G TOTAL DOCUMENTO,H NETO,I CANTIDAD */
  var wsF=XLSX.utils.json_to_sheet(fRows.length?fRows:[{"MES":"","FACTURA":"","SUCURSAL":"","EMISION":"","CLIENTE":"","RUC":"","TOTAL DOCUMENTO":0,"NETO":0,"CANTIDAD":0}]);
  wsF["!cols"]=[{wch:10},{wch:16},{wch:20},{wch:12},{wch:34},{wch:15},{wch:16},{wch:14},{wch:11}];
  XLSX.utils.book_append_sheet(wb,wsF,"Datos Facturas");
  var nF=fRows.length, fEnd=(nF||1)+1, SF="'Datos Facturas'";
  var F_TOTDOC="G", F_NETO="H", F_CANT="I", F_SUC="C", F_CLI="E";

  /* ===================== HOJA: DATOS TICKETS (para tiempos) ===================== */
  var tRows=datos.map(function(d){

      "EMISION":emiDe(t),"FECHA TICKET":fechaDMY(t.fechaTicket),

      "BULTOS RECIBIDOS":pq&&pq.cartones!=null?pq.cartones:"",
      "FECHA MERCADERIA":t.fechas&&t.fechas.mercaderia?fechaDMY(t.fechas.mercaderia):"",
      "FECHA REVISION":rev?fechaDMY(rev):"","FECHA NC":t.fechas&&t.fechas.nc?fechaDMY(t.fechas.nc):"",
      "DIAS EMI-TICKET":dd.emiTicket==null?null:+dd.emiTicket.toFixed(1),
      "DIAS TICKET-PAQUETE":dd.ticketPaq==null?null:+dd.ticketPaq.toFixed(1),

      "DIAS TICKET-MERC":dd.ticketMerc==null?null:+dd.ticketMerc.toFixed(1),
      "DIAS MERC-REV":dd.mercRev==null?null:+dd.mercRev.toFixed(1),
      "DIAS REV-NC":dd.revNC==null?null:+dd.revNC.toFixed(1),

                {wch:14},{wch:16},{wch:17},{wch:13},{wch:11},{wch:11},{wch:14},{wch:14},{wch:14},{wch:16},
                {wch:8},{wch:15},{wch:24},{wch:30},{wch:18},{wch:18},{wch:22},{wch:9},{wch:30},{wch:18},{wch:14}];
  XLSX.utils.book_append_sheet(wb,wsT,"Datos Tickets");
  var nT=tRows.length, tEnd=(nT||1)+1, ST="'Datos Tickets'";
  /* Letras reales de esta hoja: se calculan, no se escriben a mano */
  var T_NUM=colDe(tRows,"N° TICKET"), T_VEN=colDe(tRows,"VENDEDOR"), T_VAL=colDe(tRows,"VALOR TICKET"), T_ANUL=colDe(tRows,"ANULADO");
  var T_D_EMI=colDe(tRows,"DIAS EMI-TICKET"), T_D_TMERC=colDe(tRows,"DIAS TICKET-MERC"),
      T_D_MREV=colDe(tRows,"DIAS MERC-REV"), T_D_RNC=colDe(tRows,"DIAS REV-NC"), T_D_CICLO=colDe(tRows,"DIAS CICLO");

  /* ===================== HOJA: DATOS DEVOLUCIONES (con fechas de los items) ===================== */
  /* Incluye también los ítems de tickets ANULADOS para que se vean en el detalle, pero con
     CANT/TOTAL en 0: así aparecen sin alterar ninguna suma del resumen. Su valor real queda
     en las columnas "… ANULADA/O (NO CUENTA)". */
  function filaDev(t,suc,i,anul){
    var totProdReal=totalProdSheet[t.factura+"|"+i.codigo];
    var comRevision=(i.dev&&i.dev.com)?i.dev.com:((t.gar&&t.gar.com)?t.gar.com:"");
    var mrv=t.motivoRevision||null;
    var cant=+(+(i.cantNC||i.cantidad||0)).toFixed(2), tot=+(+(i.total||0)).toFixed(2);
    return {
      "N° TICKET":t.numero||"","FACTURA":t.factura||"",
      "EMISION":emiDe(t),"FECHA TICKET":fechaDMY(t.fechaTicket),
      "FECHA NC":t.fechas&&t.fechas.nc?fechaDMY(t.fechas.nc):"",
      "SUCURSAL":suc.nombre,"VENDEDOR":t.vendedor||"","MOTIVO ASESOR":t.motivo||"","REFACTURAR A":t.refactCliente||"","CLIENTE":t.razonSocial||"",
      "COD PRODUCTO":i.codigo||"","DESCRIPCION":i.desc||"","MARCA":i.sub||"",
      "CANT DEVUELTA":anul?0:cant,
      "TOTAL DEVUELTO":anul?0:tot,
      "TOTAL PRODUCTO (SHEET)":totProdReal!==undefined?+totProdReal.toFixed(2):"",
      "COMENTARIO VENDEDOR":i.comVendedor||"",
      "COMENTARIO MERCADERIA":(i.merc&&i.merc.com)||"",
      "COMENTARIO REVISION":comRevision,
      "GUIA":t.guiaNumero||"",
      "FECHA LLEGADA PAQUETE":t.fechas&&t.fechas.paquete?fechaDMY(t.fechas.paquete):"",
      "ANULADO":anul?"SI":"NO",
      "CANT ANULADA (NO CUENTA)":anul?cant:"",
      "TOTAL ANULADO (NO CUENTA)":anul?tot:"",
      "MOTIVO ANULACION":anul?(t.eliminacion&&t.eliminacion.motivo||""):"",
      "MOTIVO REVISADO":mrv?(mrv.correcto?"SI COINCIDE":"NO COINCIDE"):"",
      "MOTIVO SEGUN REVISOR":mrv?(mrv.correcto?(mrv.motivoAsesor||t.motivo):(mrv.motivoCorregido||"")):"",
      "OBSERVACION DEL REVISOR":mrv?(mrv.com||""):"",
      "FACTURA NUEVA (REFACT)":t.refactValidado&&t.refactValidado.facturaNueva||""
    };
  }
  var dRows=[];
  datos.forEach(function(d){
    var t=d.t, suc=d.suc;
    if(!d.esAceptado&&!d.anulado) return;
    var anul=d.anulado;
    var its=itemsAceptados(t);
    /* Un ticket anulado antes de ser revisado no tiene ítems aceptados: se listan los del ticket */
    if(anul&&its.length===0) its=(t.items||[]).map(function(i){ return Object.assign({},i,{cantNC:i.cantidad}); });
    its.forEach(function(i){ dRows.push(filaDev(t,suc,i,anul)); });
  });
  /* Fila plantilla solo para conservar las cabeceras cuando no hay datos en el rango */
  var dVacia=filaDev({fechas:{},items:[]},{nombre:""},{},false);
  var wsD=XLSX.utils.json_to_sheet(dRows.length?dRows:[dVacia]);
  wsD["!cols"]=[{wch:12},{wch:16},{wch:12},{wch:12},{wch:12},{wch:18},{wch:18},{wch:26},{wch:20},{wch:30},{wch:14},{wch:34},{wch:14},{wch:13},{wch:14},{wch:18},{wch:26},{wch:26},{wch:26},
                {wch:14},{wch:16},{wch:9},{wch:16},{wch:16},{wch:30},{wch:15},{wch:24},{wch:30},{wch:22}];
  XLSX.utils.book_append_sheet(wb,wsD,"Datos Devoluciones");
  var nD=dRows.length, dEnd=(nD||1)+1, SD="'Datos Devoluciones'";
  /* Letras reales de esta hoja: se calculan, no se escriben a mano */
  var dRef=dRows.length?dRows:[dVacia];
  var D_SUC=colDe(dRef,"SUCURSAL"), D_VEN=colDe(dRef,"VENDEDOR"), D_MOT=colDe(dRef,"MOTIVO ASESOR"),
      D_CLI=colDe(dRef,"CLIENTE"), D_COD=colDe(dRef,"COD PRODUCTO"), D_CANT=colDe(dRef,"CANT DEVUELTA"), D_TOT=colDe(dRef,"TOTAL DEVUELTO");

  /* ===================== HOJA ÚNICA: RESUMEN (todo junto, con fórmulas) ===================== */
  var A=[], merges=[], post=[];
  function R(a){ A.push(a||[]); return A.length-1; }   /* fila 0-based */
  function f1(r){ return r+1; }                         /* 0-based -> 1-based */
  function setF(r,c,f,z){ post.push({r:r,c:c,f:f,z:z||"0.00"}); }
  function bandera(r,c2){ merges.push({s:{r:r,c:0},e:{r:r,c:c2}}); }

  var rT=R(["REPORTE GERENCIAL DE DEVOLUCIONES — LUBAMAQUI"]); bandera(rT,7);
  var rP=R(["Periodo: "+(desde||"inicio")+" a "+(hasta||"hoy")+"   |   Generado: "+new Date().toLocaleString("es-EC")]); bandera(rP,7);
  var rN=R(["Cada número es una FÓRMULA que suma desde 'Datos Facturas', 'Datos Tickets' y 'Datos Devoluciones'. Todos los % son sobre la venta bruta."]); bandera(rN,7);
  R([]);

  /* ---- KPIs ---- */
  R(["INDICADORES PRINCIPALES"]); bandera(A.length-1,7);
  R(["Concepto","Valor","","Concepto","Valor"]);
  var kVB=R(["Venta bruta (TOTAL DOCUMENTO)","","","Total devuelto",""]);
  var kVN=R(["Venta neta (PRECIO TOTAL NETO)","","","Artículos facturados",""]);
  var kFA=R(["Facturas únicas","","","Artículos devueltos",""]);
  var kNR=R(["Venta neta real (bruta − devuelto)","","","Tasa devolución % (sobre venta bruta)",""]);
  var kRA=R(["Cantidad total ÷ devuelta","","","Tasa unidades % (sobre artíc. facturados)",""]);
  setF(kVB,1,"SUM("+SF+"!"+F_TOTDOC+"2:"+F_TOTDOC+fEnd+")");
  setF(kVN,1,"SUM("+SF+"!"+F_NETO+"2:"+F_NETO+fEnd+")");
  setF(kFA,1,"COUNTA("+SF+"!B2:B"+fEnd+")","0");
  setF(kNR,1,"B"+f1(kVB)+"-E"+f1(kVB));
  setF(kRA,1,"IFERROR(E"+f1(kVN)+"/E"+f1(kFA)+",0)","0.0");
  setF(kVB,4,"SUM("+SD+"!"+D_TOT+"2:"+D_TOT+dEnd+")");
  setF(kVN,4,"SUM("+SF+"!"+F_CANT+"2:"+F_CANT+fEnd+")");
  setF(kFA,4,"SUM("+SD+"!"+D_CANT+"2:"+D_CANT+dEnd+")");
  setF(kNR,4,"IFERROR(E"+f1(kVB)+"/B"+f1(kVB)+"*100,0)");
  setF(kRA,4,"IFERROR(E"+f1(kFA)+"/E"+f1(kVN)+"*100,0)");
  var VB="$B$"+f1(kVB);  /* referencia a venta bruta para los % */
  R([]);

  /* ---- Por sucursal: total ventas vs total devuelto ---- */
  R(["DEVOLUCIONES POR SUCURSAL — total ventas vs total devuelto"]); bandera(A.length-1,3);
  R(["Sucursal","Total ventas","Total devuelto","% sobre ventas"]);
  var sucKeys=Object.keys((function(){var o={};facts.forEach(function(v){o[sucursalDe(v.factura).nombre]=1;});datos.forEach(function(d){o[d.suc.nombre]=1;});return o;})());
  var sucStart=A.length;
  sucKeys.forEach(function(k){ R([k,"","",""]); });
  var sucEnd=A.length-1;
  for(var rs=sucStart;rs<=sucEnd;rs++){ var fs=f1(rs);
    setF(rs,1,"SUMIF("+SF+"!"+F_SUC+"2:"+F_SUC+fEnd+",A"+fs+","+SF+"!"+F_TOTDOC+"2:"+F_TOTDOC+fEnd+")");
    setF(rs,2,"SUMIF("+SD+"!"+D_SUC+"2:"+D_SUC+dEnd+",A"+fs+","+SD+"!"+D_TOT+"2:"+D_TOT+dEnd+")");
    setF(rs,3,"IFERROR(MIN(C"+fs+"/B"+fs+"*100,100),0)");
  }
  var rSucTot=R(["TOTAL","","",""]);
  setF(rSucTot,1,"SUM(B"+f1(sucStart)+":B"+f1(sucEnd)+")");
  setF(rSucTot,2,"SUM(C"+f1(sucStart)+":C"+f1(sucEnd)+")");
  setF(rSucTot,3,"IFERROR(C"+f1(rSucTot)+"/B"+f1(rSucTot)+"*100,0)");
  R([]);

  /* ---- Por vendedor (devuelto + % s/venta bruta + tiempos) ---- */
  R(["DEVOLUCIONES Y TIEMPOS POR VENDEDOR (días promedio)"]); bandera(A.length-1,7);
  R(["Vendedor","Devuelto","% s/venta bruta","Emi→Tkt (d)","Tkt→Merc (d)","Merc→Rev (d)","Rev→NC (d)","Ciclo (d)"]);
  function promVen(col,fv){ return "IFERROR(AVERAGEIFS("+ST+"!"+col+"2:"+col+tEnd+","+ST+"!"+T_VEN+"2:"+T_VEN+tEnd+",A"+fv+"),\"\")"; }
  function promTot(col){ return "IFERROR(AVERAGE("+ST+"!"+col+"2:"+col+tEnd+"),\"\")"; }
  var venKeys=Object.keys((function(){var o={};datos.forEach(function(d){o[d.t.vendedor]=1;});return o;})());
  var venStart=A.length;
  venKeys.forEach(function(k){ R([k,"","","","","","",""]); });
  var venEnd=A.length-1;
  for(var rv=venStart;rv<=venEnd;rv++){ var fv=f1(rv);
    setF(rv,1,"SUMIF("+SD+"!"+D_VEN+"2:"+D_VEN+dEnd+",A"+fv+","+SD+"!"+D_TOT+"2:"+D_TOT+dEnd+")");
    setF(rv,2,"IFERROR(B"+fv+"/"+VB+"*100,0)");
    setF(rv,3,promVen(T_D_EMI,fv),"0.0");
    setF(rv,4,promVen(T_D_TMERC,fv),"0.0");
    setF(rv,5,promVen(T_D_MREV,fv),"0.0");
    setF(rv,6,promVen(T_D_RNC,fv),"0.0");
    setF(rv,7,promVen(T_D_CICLO,fv),"0.0");
  }
  var rVenTot=R(["TOTAL","","","","","","",""]);
  setF(rVenTot,1,"SUM(B"+f1(venStart)+":B"+f1(venEnd)+")");
  setF(rVenTot,2,"IFERROR(B"+f1(rVenTot)+"/"+VB+"*100,0)");
  setF(rVenTot,3,promTot(T_D_EMI),"0.0");
  setF(rVenTot,4,promTot(T_D_TMERC),"0.0");
  setF(rVenTot,5,promTot(T_D_MREV),"0.0");
  setF(rVenTot,6,promTot(T_D_RNC),"0.0");
  setF(rVenTot,7,promTot(T_D_CICLO),"0.0");
  R([]);

  /* ---- Por motivo ---- */
  R(["DEVOLUCIONES POR MOTIVO"]); bandera(A.length-1,2);
  R(["Motivo","Devuelto","% s/venta bruta"]);
  var motKeys=Object.keys((function(){var o={};datos.forEach(function(d){o[d.t.motivo]=1;});return o;})());
  var motStart=A.length;
  motKeys.forEach(function(k){ R([k,"",""]); });
  var motEnd=A.length-1;
  for(var rm=motStart;rm<=motEnd;rm++){ var fm=f1(rm);
    setF(rm,1,"SUMIF("+SD+"!"+D_MOT+"2:"+D_MOT+dEnd+",A"+fm+","+SD+"!"+D_TOT+"2:"+D_TOT+dEnd+")");
    setF(rm,2,"IFERROR(B"+fm+"/"+VB+"*100,0)");
  }
  var rMotTot=R(["TOTAL","",""]);
  setF(rMotTot,1,"SUM(B"+f1(motStart)+":B"+f1(motEnd)+")");
  setF(rMotTot,2,"IFERROR(B"+f1(rMotTot)+"/"+VB+"*100,0)");
  R([]);

  /* ---- Top / Bottom clientes ---- */
  function cliF(r){ var fc=f1(r);
    setF(r,1,"SUMIF("+SF+"!"+F_CLI+"2:"+F_CLI+fEnd+",A"+fc+","+SF+"!"+F_TOTDOC+"2:"+F_TOTDOC+fEnd+")");
    setF(r,2,"SUMIF("+SD+"!"+D_CLI+"2:"+D_CLI+dEnd+",A"+fc+","+SD+"!"+D_TOT+"2:"+D_TOT+dEnd+")");
    setF(r,3,"IF(B"+fc+"=0,\"\",MIN(C"+fc+"/B"+fc+"*100,100))");

  R(["TOP 10 Y 10 DE ABAJO — CLIENTES (compras vs devoluciones)"]); bandera(A.length-1,3);
  R(["Cliente","Compras","Devuelto","% devuelto (s/compras)"]);
  var cliAgg={}; dRows.forEach(function(r){ cliAgg[r.CLIENTE]=(cliAgg[r.CLIENTE]||0)+r["TOTAL DEVUELTO"]; });
  var cliOrd=Object.keys(cliAgg).sort(function(a,b){return cliAgg[b]-cliAgg[a];});
  var cliTop=cliOrd.slice(0,10), cliBot=cliOrd.slice(-10).filter(function(k){return cliTop.indexOf(k)<0;});

  if(cliBot.length){ R(["— 10 que menos devuelven —"]); cliBot.forEach(function(k){ cliF(R([k,"","",""])); }); }

  R(["TOP 10 Y 10 DE ABAJO — PRODUCTOS MÁS DEVUELTOS"]); bandera(A.length-1,4);
  R(["Código","Descripción","Cant. devuelta","Monto devuelto","% s/venta bruta"]);
  var prodAgg={},prodDesc={}; dRows.forEach(function(r){ var k=r["COD PRODUCTO"]; prodAgg[k]=(prodAgg[k]||0)+r["CANT DEVUELTA"]; if(!prodDesc[k])prodDesc[k]=r.DESCRIPCION; });
  var prodOrd=Object.keys(prodAgg).sort(function(a,b){return prodAgg[b]-prodAgg[a];});
  var prodTop=prodOrd.slice(0,10), prodBot=prodOrd.slice(-10).filter(function(k){return prodTop.indexOf(k)<0;});
  R(["— TOP 10 más devueltos —"]);
  prodTop.forEach(function(k){ prodF(R([k,prodDesc[k]||"","","",""])); });
  if(prodBot.length){ R(["— 10 menos devueltos —"]); prodBot.forEach(function(k){ prodF(R([k,prodDesc[k]||"","","",""])); }); }

  /* ---- TICKETS ANULADOS (al final del resumen) ---- */
  R([]);
  R(["TICKETS ANULADOS — cuántos y de qué asesor"]); bandera(A.length-1,3);
  R(["Concepto","Valor","",""]);
  var kAnT=R(["Tickets del periodo","","",""]);
  var kAnN=R(["Tickets ANULADOS","","",""]);
  var kAnP=R(["% anulados sobre el total","","",""]);
  var kAnV=R(["Valor de lo anulado (no suma a NC)","","",""]);
  setF(kAnT,1,"COUNTA("+ST+"!"+T_NUM+"2:"+T_NUM+tEnd+")","0");
  setF(kAnN,1,"COUNTIF("+ST+"!"+T_ANUL+"2:"+T_ANUL+tEnd+",\"SI\")","0");
  setF(kAnP,1,"IFERROR(B"+f1(kAnN)+"/B"+f1(kAnT)+"*100,0)","0.0");
  setF(kAnV,1,"SUMIF("+ST+"!"+T_ANUL+"2:"+T_ANUL+tEnd+",\"SI\","+ST+"!"+T_VAL+"2:"+T_VAL+tEnd+")");
  R([]);
  R(["Asesor","Tickets anulados","Valor anulado","% de las anulaciones"]);
  var anuKeys=Object.keys((function(){var o={};datos.forEach(function(d){ if(d.anulado) o[d.t.vendedor]=1; });return o;})());
  if(anuKeys.length===0){ R(["(sin anulaciones en el periodo)","","",""]); }
  else{
    var anuStart=A.length;
    anuKeys.forEach(function(k){ R([k,"","",""]); });
    var anuEnd=A.length-1;
    for(var ra=anuStart;ra<=anuEnd;ra++){ var fa=f1(ra);
      setF(ra,1,"COUNTIFS("+ST+"!"+T_VEN+"2:"+T_VEN+tEnd+",A"+fa+","+ST+"!"+T_ANUL+"2:"+T_ANUL+tEnd+",\"SI\")","0");
      setF(ra,2,"SUMIFS("+ST+"!"+T_VAL+"2:"+T_VAL+tEnd+","+ST+"!"+T_VEN+"2:"+T_VEN+tEnd+",A"+fa+","+ST+"!"+T_ANUL+"2:"+T_ANUL+tEnd+",\"SI\")");
      setF(ra,3,"IFERROR(B"+fa+"/$B$"+f1(kAnN)+"*100,0)","0.0");
    }
    var rAnuTot=R(["TOTAL","","",""]);
    setF(rAnuTot,1,"SUM(B"+f1(anuStart)+":B"+f1(anuEnd)+")","0");
    setF(rAnuTot,2,"SUM(C"+f1(anuStart)+":C"+f1(anuEnd)+")");
  }
  R(["El detalle de cada anulación (motivo, quién la hizo y fecha) está en la hoja 'Datos Tickets', al final de cada fila."]); bandera(A.length-1,3);

  var wsR=XLSX.utils.aoa_to_sheet(A);
  wsR["!merges"]=merges;
  wsR["!cols"]=[{wch:34},{wch:16},{wch:16},{wch:16},{wch:14},{wch:14},{wch:12},{wch:11}];
  post.forEach(function(p){ wsR[XLSX.utils.encode_cell({r:p.r,c:p.c})]={t:"n",f:p.f,z:p.z}; });
  XLSX.utils.book_append_sheet(wb,wsR,"Resumen");

  /* ===================== HOJA: CÓMO GRAFICAR ===================== */
  var guia=[
    ["CÓMO CREAR GRÁFICOS Y TABLAS DINÁMICAS CON ESTE ARCHIVO"],
    [""],
    ["Las librerías que corren dentro del navegador (sin servidor) no pueden INSERTAR gráficos ni tablas"],
    ["dinámicas nativas dentro del .xlsx. Por eso este reporte trae los DATOS limpios y el RESUMEN ya"],
    ["calculado con fórmulas, todo enlazado, listo para graficar en 2 clics:"],
    [""],
    ["GRÁFICO DESDE LA HOJA 'Resumen':"],
    ["  1. Selecciona la tabla de la sección que quieras (ej. 'Por sucursal' o 'Por vendedor')."],
    ["  2. Insertar -> Grafico -> Columnas agrupadas (o Lineas)."],
    [""],
    ["TABLA DINAMICA (PivotTable) desde los datos crudos:"],
    ["  1. Ve a 'Datos Devoluciones' o 'Datos Facturas'."],
    ["  2. Ctrl+A -> Insertar -> Tabla dinamica."],
    ["  3. Ejemplo: Filas = VENDEDOR, Valores = TOTAL DEVUELTO (Suma)."],
    ["  4. Con la tabla dinamica seleccionada: Insertar -> Grafico dinamico."],
    [""],
    ["TODO ESTA ENLAZADO: si cambias un dato en las hojas 'Datos ...', el Resumen se recalcula solo."]
  ];
  var wsG=XLSX.utils.aoa_to_sheet(guia);
  wsG["!cols"]=[{wch:95}];
  XLSX.utils.book_append_sheet(wb,wsG,"Cómo graficar");

  /* ===================== HOJA: DIAGNÓSTICO ===================== */
  var ventaBruta=0, totalDevuelto=0, devAprobado=0, devProceso=0, vSucX={}, sucD={}, venD={}, motD={}, prodCx={}, cliInfo={};
  facts.forEach(function(v){ ventaBruta+=v.totalDoc; var sn=sucursalDe(v.factura).nombre; vSucX[sn]=(vSucX[sn]||0)+v.totalDoc; });
  datos.forEach(function(d){ var t=d.t; if(d.anulado) return; if(d.esAceptado){ totalDevuelto+=d.aceptado; devAprobado+=d.aceptado; sucD[d.suc.nombre]=(sucD[d.suc.nombre]||0)+d.aceptado; venD[t.vendedor]=(venD[t.vendedor]||0)+d.aceptado; motD[t.motivo]=(motD[t.motivo]||0)+d.aceptado; if(!cliInfo[t.razonSocial]) cliInfo[t.razonSocial]={monto:0}; cliInfo[t.razonSocial].monto+=d.aceptado; itemsAceptados(t).forEach(function(i){ if(!prodCx[i.codigo]) prodCx[i.codigo]={cant:0,monto:0,desc:i.desc}; prodCx[i.codigo].cant+=(i.cantNC||0); prodCx[i.codigo].monto+=i.total; }); } else { devProceso+=d.totalTicket; } });
  var tasaG=ventaBruta>0?(totalDevuelto/ventaBruta*100):0;
  var diag=[];
  function dg(p,a,hh,r){ diag.push({"PRIORIDAD":p,"ÁREA":a,"HALLAZGO":hh,"RECOMENDACIÓN":r}); }
  if(tasaG>UMBRAL_ALERTA) dg("🔴 ALTA","General","Tasa de devolución global "+tasaG.toFixed(2)+"% (sobre "+UMBRAL_ALERTA+"%)","Revisar urgente proceso de venta y despacho.");
  else if(tasaG>UMBRAL_OK) dg("🟡 MEDIA","General","Tasa de devolución "+tasaG.toFixed(2)+"% (entre "+UMBRAL_OK+"% y "+UMBRAL_ALERTA+"%)","Monitorear semanal. Identificar las 2-3 causas principales.");
  else dg("🟢 OK","General","Tasa de devolución "+tasaG.toFixed(2)+"% (bajo "+UMBRAL_OK+"%)","Nivel saludable. Mantener controles actuales.");
  Object.keys(vSucX).forEach(function(s){ var vb=vSucX[s]||0, dev=sucD[s]||0, ta=vb>0?dev/vb*100:0; if(ta>UMBRAL_ALERTA&&vb>0) dg("🔴 ALTA","Sucursal: "+s,"Tasa "+ta.toFixed(2)+"% (venta "+money(vb)+", devuelto "+money(dev)+")","Auditar esta sucursal."); });
  var venTop=Object.keys(venD).sort(function(a,b){return venD[b]-venD[a];});
  if(venTop.length&&totalDevuelto>0){ var pct=venD[venTop[0]]/totalDevuelto*100; if(pct>25) dg("🟡 MEDIA","Vendedor: "+venTop[0],"Concentra "+pct.toFixed(0)+"% de las devoluciones ("+money(venD[venTop[0]])+")","Revisar con el vendedor."); }
  var prodTopD=Object.keys(prodCx).sort(function(a,b){return prodCx[b].cant-prodCx[a].cant;});
  if(prodTopD.length){ var pp=prodCx[prodTopD[0]]; if(pp.cant>=5) dg("🔴 ALTA","Producto: "+prodTopD[0]+" "+(pp.desc||"").slice(0,30),"El más devuelto: "+pp.cant+" unidades, "+money(pp.monto),"Revisar calidad del lote y catálogo."); }
  var motTopD=Object.keys(motD).sort(function(a,b){return motD[b]-motD[a];});
  if(motTopD.length&&totalDevuelto>0){ var pm2=motD[motTopD[0]]/totalDevuelto*100; dg(pm2>40?"🔴 ALTA":"🟡 MEDIA","Motivo: "+motTopD[0],"Causa #1: "+pm2.toFixed(0)+"% de las devoluciones","Atacar esta causa raíz."); }
  if(devProceso>devAprobado&&devProceso>0) dg("🟡 MEDIA","Operación","Más monto EN PROCESO ("+money(devProceso)+") que aprobado ("+money(devAprobado)+")","Agilizar revisión de tickets.");
  var pc=promDe((function(){var o={s:0,n:0};datos.forEach(function(d){var dd=diasTicket(d.t);if(dd.ciclo!=null){o.s+=dd.ciclo;o.n++;}});return o;})());
  if(pc!=null&&pc>15) dg(pc>30?"🔴 ALTA":"🟡 MEDIA","Tiempos de gestión","Ciclo promedio ticket→NC: "+dnum(pc)+" días","Agilizar las etapas más lentas (sección 'Por vendedor' en la hoja Resumen).");
  if(diag.length===0) dg("🟢 OK","General","Sin alertas críticas en el periodo","Operación saludable.");
  var ws3=XLSX.utils.json_to_sheet(diag);
  ws3["!cols"]=[{wch:12},{wch:28},{wch:55},{wch:55}];
  XLSX.utils.book_append_sheet(wb,ws3,"Diagnóstico y mejoras");

  var suf=(desde||hasta)?("_"+(desde||"inicio")+"_a_"+(hasta||"hoy")):"";
  XLSX.writeFile(wb,"Reporte_Gerencial_Devoluciones"+suf+".xlsx");
}

/* ===== INIT ===== */
window.addEventListener("error",function(ev){ try{ var m=$("load-msg"); if(m) m.textContent="Error: "+(ev.message||"desconocido"); }catch(e){} });
function arrancar(){
  var intentos=0;
  function probar(){
    intentos++;
    if(typeof firebase!=="undefined"){
      initFirebase().then(function(ok){
        if(ok) cargarEstado();
        else $("main").innerHTML='<div class="card"><div class="empty"><div class="big">Sin conexión a Firebase</div>No se pudo inicializar. Recarga la página.</div></div>';
      });
      return;
    }
    if(intentos>20){
      $("main").innerHTML='<div class="card"><div class="empty"><div class="big">No se cargó Firebase</div>Verifica tu conexión a internet y recarga la página.</div></div>';
      return;
    }
    var m=$("load-msg"); if(m) m.textContent="Cargando librerías… ("+intentos+")";
    setTimeout(probar,400);
  }
  probar();
}
if(document.readyState==="loading"){ document.addEventListener("DOMContentLoaded",arrancar); }
else { arrancar(); }
</script>
